# Local PostgreSQL for Clause: docker compose -f docker-compose.postgres.yml up -d
# Then set DATABASE_URL=postgresql://clause:clause@127.0.0.1:5432/clause in .env
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clause
      POSTGRES_PASSWORD: clause
      POSTGRES_DB: clause
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - clause-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clause"]
      interval: 5s
      retries: 10
volumes:
  clause-postgres:
